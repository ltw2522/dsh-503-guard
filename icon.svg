  <path d="M44 18 A12 12 0 1 1 44 46"
        fill="none" stroke="#f5a524" stroke-width="3"
        stroke-linecap="round"/>
  <path d="M44 13 L44 23 L34 18 Z" fill="#f5a524"/>
</svg>
