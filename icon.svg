<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="503 self-heal guard">
  <!-- 深色圆角底：与 DSH 深色界面同调，插件列表里不刺眼 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#1f2430"/>
  <!-- 心电基线：左半段的平稳信号，代表网关正常 -->
